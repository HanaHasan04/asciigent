<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASCII Animation: cat</title>
  <style>
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    h2 { margin-bottom: 0.5em; }
    pre {
      font-family: "Consolas", "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 14px;
      line-height: 1.2;
      background: #000;
      padding: 16px;
      border-radius: 4px;
      white-space: pre;
      border: 1px solid #444;
    }
    #controls { margin-top: 1em; }
    button {
      padding: 0.4em 1.2em;
      margin: 0 0.3em;
      cursor: pointer;
      border-radius: 3px;
      border: 1px solid #888;
      background: #333;
      color: #e0e0e0;
    }
    #frame-info { color: #888; margin-top: 0.3em; font-size: 0.85em; }
  </style>
</head>
<body>
  <h2>ASCII Animation &mdash; cat</h2>
  <pre id="canvas">Loading…</pre>
  <div id="controls">
    <button onclick="togglePlay()">⏸ Pause</button>
    <button onclick="stepFrame(-1)">⏮ Prev</button>
    <button onclick="stepFrame(1)">Next ⏭</button>
  </div>
  <div id="frame-info"></div>
  <script>
    const FRAMES = ["                  /\\_/\\                         \n                 ( o.o )                        \n             =-   > ^ <   -=                    \n                 /--o--\\                        \n                /       \\                       \n               /   | |   \\                      \n              |    | |    |   _                 \n              |    | |    |  / )                \n               \\  (_|_)  /  / /                 \n                \\_______/__/_/                  \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                ", "                  /\\_/\\                         \n                 ( -.- )                        \n             =-   > ^ <   -=                    \n                 /--o--\\                        \n                /       \\                       \n               /   | |   \\                      \n              |    | |    |                     \n              |    | |    |   __                \n               \\  (_|_)  /   / _)               \n                \\_______/___/_/                 \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                ", "                  /\\_/\\                         \n                 ( ^.^ )                        \n             =-   > ^ <   -=                    \n                 /--o--\\                        \n                /       \\                       \n               /   | |   \\                      \n              |    | |    |   _                 \n              |    | |    |  ( \\                \n               \\  (_|_)  /    \\ \\               \n                \\_______/_____/_/               \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                \n                                                "];
    const INTERVAL = 500;
    let idx = 0;
    let playing = true;
    let timer = null;

    function showFrame(i) {
      idx = ((i % FRAMES.length) + FRAMES.length) % FRAMES.length;
      document.getElementById("canvas").textContent = FRAMES[idx];
      document.getElementById("frame-info").textContent =
        "Frame " + (idx + 1) + " / " + FRAMES.length + "  ·  2 fps";
    }

    function tick() { showFrame(idx + 1); }

    function togglePlay() {
      playing = !playing;
      if (playing) {
        timer = setInterval(tick, INTERVAL);
        document.querySelector("button").textContent = "⏸ Pause";
      } else {
        clearInterval(timer);
        document.querySelector("button").textContent = "▶ Play";
      }
    }

    function stepFrame(delta) {
      if (playing) togglePlay();
      showFrame(idx + delta);
    }

    showFrame(0);
    timer = setInterval(tick, INTERVAL);
  </script>
</body>
</html>
